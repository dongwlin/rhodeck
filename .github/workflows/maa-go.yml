name: maa-go

# Layered verification for the maa-go binding on Linux amd64.
#
# CI intentionally runs only layers that need no MaaCore release artifact:
# static declaration checks, Go/fake-native tests, loader/ABI/callback
# fixtures, the CGO_ENABLED=0 build/vet, and gofmt. The real-MaaCore
# (`core`) layer is local-only and is never claimed by this workflow. A skip
# or missing toolchain in a selected layer is UNVERIFIED (binary exit 2); a
# real failure is exit 1. Either fails the job.
#
# The race layer uses -race and CGO_ENABLED=1 but skips real-core acceptance
# (TestRealCore); that remains local-only and is covered by the core layer.
"on":
  push:
    paths:
      - "packages/maa-go/**"
      - "tools/check-maa-api/**"
      - "tools/maa-go-check/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/maa-go.yml"
  pull_request:
    paths:
      - "packages/maa-go/**"
      - "tools/check-maa-api/**"
      - "tools/maa-go-check/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/maa-go.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: layered check (CGO_ENABLED=0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache: true
      - name: Install C toolchain for fixtures
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Build layered checker
        run: go build -o /tmp/maa-go-check ./tools/maa-go-check
      - name: Run layered checks
        run: /tmp/maa-go-check --layers ci

  race:
    name: race detector on Go unit tests (real-core acceptance excluded)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache: true
      - name: Install C toolchain for fixtures
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Build layered checker
        run: go build -o /tmp/maa-go-check ./tools/maa-go-check
      - name: Run race layer
        run: /tmp/maa-go-check --layers race
