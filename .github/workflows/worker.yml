name: worker

# Platform matrix for the full worker: runtime tests on Linux/Windows amd64
# and macOS amd64/arm64 (CGO_ENABLED=0, real MaaCore excluded), a Linux race
# job, and linux/windows/darwin x amd64/arm64 cross-compilation of packages
# and test binaries without execution.
#
# The Linux runtime jobs execute the actual worker/native-fixture tests: the
# controlled native libraries are compiled at test time, so a C toolchain is
# installed explicitly. The API coverage drift gate (tools/api-coverage) runs
# on Linux as the integrity entry for the frozen full-worker mapping.
#
# The real-Core no-device test (TestRealCoreWorkerNoDevice) stays explicitly
# excluded: it is opt-in through caller-owned environment inputs on a machine
# that provides MaaCore, and a CI skip never counts as a verified pass.
"on":
  push:
    paths:
      - "apps/core-worker/**"
      - "packages/control/worker/**"
      - "packages/maa-go/**"
      - "tools/api-coverage/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/worker.yml"
  pull_request:
    paths:
      - "apps/core-worker/**"
      - "packages/control/worker/**"
      - "packages/maa-go/**"
      - "tools/api-coverage/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: process tests (${{ matrix.target }}, CGO_ENABLED=0)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux/amd64
            runner: ubuntu-latest
          - target: windows/amd64
            runner: windows-latest
          - target: darwin/arm64
            runner: macos-latest
          - target: darwin/amd64
            runner: macos-15-intel
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache: true
      - name: Install C toolchain for native fixtures
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Build and vet
        run: |
          go build ./apps/core-worker ./packages/control/worker/... ./tools/api-coverage
          go vet ./apps/core-worker ./packages/control/worker/... ./tools/api-coverage
      - name: Unit and process tests with native fixtures (real Core excluded)
        run: go test ./apps/core-worker ./packages/control/worker/... -skip TestRealCoreWorker -count=1 -timeout=3m
      - name: API coverage drift gate
        if: runner.os == 'Linux'
        run: |
          go test ./tools/api-coverage
          go run ./tools/api-coverage --root .
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l apps/core-worker packages/control/worker tools/api-coverage)"
          if [ -n "$unformatted" ]; then printf '%s\n' "$unformatted"; exit 1; fi

  race:
    name: race detector (linux/amd64, real Core excluded)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache: true
      - name: Install C toolchain for native fixtures
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Unit and process tests with race detector
        run: go test -race ./apps/core-worker ./packages/control/worker/... -skip TestRealCoreWorker -count=1 -timeout=8m

  cross-build:
    name: cross-compile (${{ matrix.goos }}/${{ matrix.goarch }}, no execution)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache: true
      - name: Compile worker, supervisor and tests
        run: |
          go build ./apps/core-worker ./packages/control/worker/...
          mkdir -p "$RUNNER_TEMP/worker-tests"
          go test -c -o "$RUNNER_TEMP/worker-tests/" ./apps/core-worker ./packages/control/worker/...
