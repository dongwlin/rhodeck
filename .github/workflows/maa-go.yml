name: maa-go

# Unit verification on Linux/Windows amd64 and macOS arm64.
#
# CI intentionally runs only layers that need no MaaCore release artifact:
# static declaration checks, Go/fake-native tests, CGO_ENABLED=0 build/vet,
# and gofmt on every platform; loader/ABI/callback fixtures on Linux only.
# Windows/macOS unit tests do not imply native loader support. The real-MaaCore
# (`core`) layer is local-only and is never claimed by this workflow. A skip
# or missing toolchain in a selected layer is UNVERIFIED (binary exit 2); a
# real failure is exit 1. Either fails the job.
#
# The race layer uses -race and CGO_ENABLED=1 but skips real-core acceptance
# (TestRealCore); that remains local-only and is covered by the core layer.
"on":
  push:
    paths:
      - "packages/maa-go/**"
      - "tools/check-maa-api/**"
      - "tools/maa-go-check/**"
      - "go.mod"
      - "go.sum"
      - ".gitattributes"
      - ".github/workflows/maa-go.yml"
  pull_request:
    paths:
      - "packages/maa-go/**"
      - "tools/check-maa-api/**"
      - "tools/maa-go-check/**"
      - "go.mod"
      - "go.sum"
      - ".gitattributes"
      - ".github/workflows/maa-go.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: unit checks (${{ matrix.target }}, CGO_ENABLED=0)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux/amd64
            runner: ubuntu-24.04
            layers: ci
          - target: windows/amd64
            runner: windows-2025
            layers: static,go,build,fmt
          - target: darwin/arm64
            runner: macos-15
            layers: static,go,build,fmt
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache: true
      - name: Install C toolchain for fixtures
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Build layered checker
        run: go build -o maa-go-check.exe ./tools/maa-go-check
      - name: Run layered checks
        run: ./maa-go-check.exe --layers '${{ matrix.layers }}'

  race:
    name: race detector (linux/amd64, real-core acceptance excluded)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache: true
      - name: Install C toolchain for fixtures
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Build layered checker
        run: go build -o /tmp/maa-go-check ./tools/maa-go-check
      - name: Run race layer
        run: /tmp/maa-go-check --layers race

  cross-build:
    name: cross-compile (${{ matrix.goos }}/${{ matrix.goarch }}, no execution)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache: true
      - name: Compile packages
        run: go build ./...
      - name: Compile test binaries without running them
        run: |
          mkdir -p "$RUNNER_TEMP/maa-go-tests"
          go test -c -o "$RUNNER_TEMP/maa-go-tests/" ./...
